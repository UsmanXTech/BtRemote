name: Manual Build

# Manual-only: this workflow never runs on push, pull_request, or a schedule.
# Trigger it from the Actions tab -> Manual Build -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run unit tests before building"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        if: inputs.run_tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: btremote-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
